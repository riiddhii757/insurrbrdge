services:
  - type: web
    name: insurrbrdge-web
    runtime: ruby
    plan: free
    region: virginia
    branch: main
    buildCommand: bundle install && bundle exec rails assets:precompile
    startCommand: bundle exec rails db:prepare && bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_LOG_LEVEL
        value: info
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_HOST
        sync: false
      - key: MAILER_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
